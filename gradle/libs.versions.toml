viewpager2 = "1.1.0"
xmpcore = "6.1.11"
zoomimage = "1.4.0"
generateBp = "+"

[libraries]
adobe-xmpcore = { group = "com.adobe.xmp", name = "xmpcore", version.ref = "xmpcore" }
