activity = "1.12.0-alpha08"
appcompat = "1.7.1"
composeBom = "2026.06.00"
composeCompiler = "2.2.10"
constraintlayout = "2.2.1"
core = "1.18.0-alpha01"
exifinterface = "1.4.0-alpha01"
fragment = "1.8.9"
glide = "5.0.7"
glideCompose = "1.0.0-beta09"
